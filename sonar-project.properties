# SonarCloud analysis from the Tests workflow. See docs/standards.md, "Continuous integration".
sonar.organization=helop-ou
sonar.projectKey=helop-ou_lagoon
sonar.sources=Lagoon,LagoonTopShelf,scripts,.github
sonar.tests=LagoonTests,LagoonUITests
sonar.exclusions=**/*.xcassets/**
sonar.coverageReportPaths=coverage/coverage-tvOS.xml,coverage/coverage-iOS.xml
# SwiftUI views are checked by snapshots and on device, not unit tests.
sonar.coverage.exclusions=**/*View.swift,**/Views/**,Lagoon/Shared/UI/**,scripts/**,.github/**
