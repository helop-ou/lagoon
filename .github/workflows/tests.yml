# See docs/standards.md, "Continuous integration".
name: Tests

on:
  pull_request:
  # Keeps SonarCloud's main dashboard and its coverage current.
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.platform }})
    # macos-26 tops out at Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: tvOS
            simulator: Apple TV 4K (4th generation)
          # The image has no iPhone 17 Pro.
          - platform: iOS
            simulator: iPhone 17
    env:
      # Keep in step with the local Xcode.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      # The runtime the snapshot references were recorded on. Moves with Xcode.
      SIMULATOR_RUNTIME: "27.2"
    steps:
      - uses: actions/checkout@v7

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('Lagoon.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # The image lacks it, and Lagoon compiles Metal shaders.
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Show toolchain
        run: xcodebuild -version

      - name: Pick the simulator
        id: simulator
        run: |
          pick() {
            scripts/pick-simulator.py --minimum "$SIMULATOR_RUNTIME" --create \
              "${{ matrix.platform }}" "${{ matrix.simulator }}"
          }
          # An image from before that runtime has older ones only.
          if ! destination="$(pick)"; then
            xcodebuild -downloadPlatform "${{ matrix.platform }}"
            destination="$(pick)"
          fi
          echo "destination=$destination" >> "$GITHUB_OUTPUT"

      # Serial: in parallel on the runner's three cores, tests that wait on
      # a clock starve. Collecting diagnostics adds ten minutes to a failure.
      - name: Test
        run: |
          mkdir -p build
          status=0
          xcodebuild test \
            -scheme Lagoon \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            -enableCodeCoverage YES \
            -collect-test-diagnostics never \
            -parallel-testing-enabled NO \
            > build/xcodebuild.log 2>&1 || status=$?
          grep -E ": error: |^error: |✘|\*\* (BUILD|TEST) |Test run with" build/xcodebuild.log || true
          exit "$status"

      - name: Export coverage
        run: scripts/coverage-to-sonar.py "${{ matrix.platform }}"

      - name: Keep coverage for the scan
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.platform }}
          path: build/coverage-${{ matrix.platform }}.xml
          retention-days: 1

      - name: Keep results of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.platform }}
          path: |
            build/TestResults.xcresult
            build/xcodebuild.log
            Snapshots/**/*.failed.png
            Snapshots/**/*.diff.png
          if-no-files-found: ignore
          retention-days: 14

  # The one UI journey in CI: a closed Duo is the only place its bug shows.
  # A fresh Duo simulator starts closed. It signs into the public demo.
  duo-journey:
    name: UI journey (iPhone Duo)
    if: github.event_name == 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('Lagoon.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Pick the simulator
        run: |
          destination="$(scripts/pick-simulator.py iOS "iPhone Duo")"
          echo "DUO_UDID=${destination##*id=}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          mkdir -p build
          status=0
          xcodebuild build-for-testing \
            -scheme LagoonHardwareRegression \
            -destination "platform=iOS Simulator,id=$DUO_UDID" \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -derivedDataPath build/DerivedData \
            > build/xcodebuild-build.log 2>&1 || status=$?
          grep -E ": error: |^error: |\*\* (BUILD|TEST) " build/xcodebuild-build.log || true
          exit "$status"

      # A cold simulator took over two minutes to open the app, past
      # XCUITest's launch timeout. Boot it and open the app once first.
      - name: Warm the simulator
        run: |
          xcrun simctl bootstatus "$DUO_UDID" -b
          xcrun simctl install "$DUO_UDID" build/DerivedData/Build/Products/Debug-iphonesimulator/Lagoon.app
          xcrun simctl launch "$DUO_UDID" ee.helop.lagoon
          xcrun simctl terminate "$DUO_UDID" ee.helop.lagoon

      - name: Test
        run: |
          status=0
          xcodebuild test-without-building \
            -scheme LagoonHardwareRegression \
            -destination "platform=iOS Simulator,id=$DUO_UDID" \
            -only-testing:LagoonUITests/DuoLayoutUITests \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            -collect-test-diagnostics never \
            > build/xcodebuild.log 2>&1 || status=$?
          grep -E ": error: |^error: |Test Case .*(passed|failed|skipped)|\*\* (BUILD|TEST) " build/xcodebuild.log || true
          exit "$status"

      - name: Keep results of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-duo
          path: |
            build/TestResults.xcresult
            build/xcodebuild-build.log
            build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14

  sonar:
    name: SonarCloud scan
    needs: unit-tests
    # A fork's pull request gets no secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      - name: Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
