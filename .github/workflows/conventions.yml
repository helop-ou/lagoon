# Branch name, title, description and commits of every pull request.
# See docs/standards.md, "Pull requests".
name: Conventions

on:
  pull_request:
    # Also on edits, so fixing a title or description re-runs it.
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: conventions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conventions:
    name: Pull request conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Passed through the environment, never interpolated into the script,
      # so a title or description cannot run as shell.
      - name: Check
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-pull-request.sh
