# See docs/release.md, "Releasing from CI".
name: Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: "prepare: open the release pull request for the unreleased notes. trial: sign both apps, upload nothing. upload: send an external-eligible build to App Store Connect. publish: create the GitHub release of a build that went out."
        type: choice
        options: [prepare, trial, upload, publish]
      bump:
        description: "Version bump, for prepare only. Major for a significant rework, minor for new features, patch for fixes only."
        type: choice
        options: [patch, minor, major]
        default: patch
      headline:
        description: "The release's one-line headline, for prepare only."
        required: false
      build:
        description: "Build to publish, for publish only. Empty publishes the build main declares."
        required: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    if: inputs.action == 'prepare'
    environment: release
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      BUMP: ${{ inputs.bump }}
      HEADLINE: ${{ inputs.headline }}
      # Not github.token: a pull request it opens never starts the checks main requires.
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      # CHANGELOG.md is rendered by a test, which builds.
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Prepare
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/prepare-release.sh "$BUMP" "$HEADLINE" --open-pr

  archive:
    name: ${{ inputs.action }}
    if: inputs.action == 'trial' || inputs.action == 'upload'
    # Holds the secrets, and only main may use it.
    environment: release
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      ACTION: ${{ inputs.action }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      LAGOON_SENTRY_DSN: ${{ secrets.LAGOON_SENTRY_DSN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Write the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Archive and sign
        run: |
          if [ "$ACTION" = trial ]; then
            scripts/upload-testflight.sh both --export-only
          else
            scripts/upload-testflight.sh both --external
          fi

      # So the publish run, on another machine, tags exactly this revision.
      - name: Record the archived revision
        if: inputs.action == 'upload'
        run: |
          build="$(grep -m1 -o 'CURRENT_PROJECT_VERSION = [0-9]*' Lagoon.xcodeproj/project.pbxproj | grep -o '[0-9]*$')"
          git push origin "HEAD:refs/archived/${build}"

  publish:
    name: publish
    if: inputs.action == 'publish'
    environment: release
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      BUILD: ${{ inputs.build }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The script checks the codec table against the profile, which builds.
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Publish
        run: |
          build="${BUILD:-$(grep -m1 -o 'CURRENT_PROJECT_VERSION = [0-9]*' Lagoon.xcodeproj/project.pbxproj | grep -o '[0-9]*$')}"
          scripts/publish-release.sh "$build"
