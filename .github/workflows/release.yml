# See docs/release.md, "Releasing from CI".
name: Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: "prepare: open the release pull request for the unreleased notes. trial: sign both apps, upload nothing. upload: send an external-eligible build to App Store Connect. publish: create the GitHub release of a build that went out."
        type: choice
        options: [prepare, trial, upload, publish]
      bump:
        description: "Version bump, for prepare only. Major for a significant rework, minor for new features, patch for fixes only. Build for the same version again, when the fix needs no note."
        type: choice
        options: [patch, minor, major, build]
        default: patch
      headline:
        description: "The release's one-line headline, for prepare only. Empty for a build."
        required: false
      build:
        description: "Build to publish, for publish only. Empty publishes the build main declares."
        required: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    if: inputs.action == 'prepare'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BUMP: ${{ inputs.bump }}
      HEADLINE: ${{ inputs.headline }}
    steps:
      # Not github.token: a pull request it opens never starts the checks main requires.
      - name: Mint the release token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Prepare
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/prepare-release.sh "$BUMP" "$HEADLINE" --open-pr

  archive:
    name: ${{ inputs.action }}
    if: inputs.action == 'trial' || inputs.action == 'upload'
    # Holds the secrets, and only main may use it.
    environment: release
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      ACTION: ${{ inputs.action }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      LAGOON_SENTRY_DSN: ${{ secrets.LAGOON_SENTRY_DSN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Write the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      # Each empty runner creates a development certificate to sign with, and
      # once the team reaches Apple's limit the archive fails. See docs/release.md.
      - name: Revoke earlier CI development certificates
        run: |
          set -uo pipefail
          api=https://api.appstoreconnect.apple.com/v1/certificates
          now="$(date +%s)"

          # 1. A login token for Apple's API: a JWT signed with the API key.
          base64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          header="$(printf '{"alg":"ES256","kid":"%s","typ":"JWT"}' "$ASC_KEY_ID" | base64url)"
          claims="$(printf '{"iss":"%s","iat":%d,"exp":%d,"aud":"appstoreconnect-v1"}' "$ASC_ISSUER_ID" "$now" $((now + 600)) | base64url)"
          # openssl wraps the signature's two numbers in DER, and a JWT wants them bare, 32 bytes each.
          signature="$(printf '%s.%s' "$header" "$claims" \
            | openssl dgst -sha256 -sign "$ASC_KEY_PATH" \
            | openssl asn1parse -inform DER \
            | awk -F: '/INTEGER/ { v = $NF; while (length(v) < 64) v = "0" v; printf "%s", substr(v, length(v) - 63) }' \
            | xxd -r -p | base64url)"
          auth="Authorization: Bearer $header.$claims.$signature"

          # 2. The certificates an API key made, over three hours old, so a run in
          # another repository keeps the one it is signing with. They last a year,
          # so the expiry date gives the age.
          if ! list="$(curl -fsS -H "$auth" "$api?filter%5BcertificateType%5D=DEVELOPMENT&limit=200")"; then
            echo "::warning::Could not list the certificates, so none were revoked"
            exit 0
          fi
          cutoff=$((now + 365 * 86400 - 3 * 3600))
          old="$(jq -r --argjson cutoff "$cutoff" '.data[]
            | select((.attributes.name // "") + (.attributes.displayName // "") | contains("Created via API"))
            | select((try (.attributes.expirationDate[0:19] + "Z" | fromdateiso8601) catch infinite) < $cutoff)
            | .id' <<< "$list")"

          # 3. Revoke them. Xcode creates a fresh one for this run.
          for id in $old; do
            curl -fsS -X DELETE -H "$auth" "$api/$id" \
              && echo "Revoked $id" \
              || echo "::warning::Could not revoke certificate $id"
          done
          echo "Revoked $(wc -w <<< "$old" | tr -d ' ') certificate(s)"

      - name: Archive and sign
        run: |
          if [ "$ACTION" = trial ]; then
            scripts/upload-testflight.sh both --export-only
          else
            scripts/upload-testflight.sh both --external
          fi

      # So the publish run, on another machine, tags exactly this revision.
      - name: Record the archived revision
        if: inputs.action == 'upload'
        run: |
          build="$(grep -m1 -o 'CURRENT_PROJECT_VERSION = [0-9]*' Lagoon.xcodeproj/project.pbxproj | grep -o '[0-9]*$')"
          git push origin "HEAD:refs/archived/${build}"

  publish:
    name: publish
    if: inputs.action == 'publish'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      BUILD: ${{ inputs.build }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish
        run: |
          build="${BUILD:-$(grep -m1 -o 'CURRENT_PROJECT_VERSION = [0-9]*' Lagoon.xcodeproj/project.pbxproj | grep -o '[0-9]*$')}"
          scripts/publish-release.sh "$build"
